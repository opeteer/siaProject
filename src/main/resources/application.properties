spring.application.name=sia-usd

# Server
server.port=${PORT:8020}
server.address=0.0.0.0

# Datasource: PostgreSQL if provided, fallback to H2 if local postgres is not running
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:siadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Docker Compose integration
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.lifecycle-management=start-and-stop

# Logging
logging.level.com.opeteer.spring_boot=INFO
